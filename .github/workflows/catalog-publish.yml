name: Publish Policy Catalog Artifacts

on:
  push:
    branches: [main]
    paths: ["policy-catalog/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: policy-catalog

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check schema compatibility
        run: ./gradlew schemaCompat
      - uses: oras-project/setup-oras@v1
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build current and versioned OCI artifacts
        run: |
          ./gradlew buildXRegistryOciPublish -PociArtifactTag=current
          ./gradlew buildXRegistryOciPublish -PociArtifactTag=v${{ github.run_number }}
      - name: Publish OCI artifacts
        shell: bash
        run: |
          OWNER_LC="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          for TAG in current v${{ github.run_number }}; do
            oras push "ghcr.io/${OWNER_LC}/xregistry-policies:${TAG}" "build/out/xregistry-policies-${TAG}.tar.gz:application/vnd.dspace.xregistry.v1+1"
            oras push "ghcr.io/${OWNER_LC}/xregistry-dataspace-schemas:${TAG}" "build/out/xregistry-dataspace-schemas-${TAG}.tar.gz:application/vnd.dspace.xregistry.v1+1"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tap74-policy-catalog-artifacts
          path: policy-catalog/build/out/
