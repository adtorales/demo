name: Check Policy Catalog Schema Compatibility

on:
  pull_request:
    paths:
      - "policy-catalog/src/main/xregistry/schemas/**"
      - "policy-catalog/dataspace/src/main/xregistry/schemas/**"
  workflow_dispatch:

defaults:
  run:
    working-directory: policy-catalog

jobs:
  schema-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Check schema compatibility
        run: ./gradlew schemaCompat
