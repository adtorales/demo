name: Validate Policy Catalog

on:
  pull_request:
    paths: ["policy-catalog/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: policy-catalog

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Validate xRegistry envelopes and policy content
        run: ./gradlew validateXRegistry
      - name: Run semantic policy checks
        run: ./gradlew semanticTest
