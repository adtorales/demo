apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tap74-registry.fullname" . }}
  labels:
    {{- include "tap74-registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "tap74-registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tap74-registry.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ include "tap74-registry.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8181
              protocol: TCP
          env:
            - name: WEB_HTTP_PORT
              value: "8181"
            - name: EDC_REGISTRY_URL
              value: {{ .Values.registry.url | quote }}
            - name: EDC_REGISTRY_OCI_IMAGES
              value: {{ .Values.registry.oci.images | quote }}
            - name: EDC_REGISTRY_OCI_POLL_SECONDS
              value: {{ .Values.registry.oci.pollSeconds | quote }}
            - name: EDC_REGISTRY_OCI_INSECURE
              value: {{ .Values.registry.oci.insecure | quote }}
            {{- if .Values.registry.oci.username }}
            - name: EDC_REGISTRY_OCI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.existingSecret | default (include "tap74-registry.fullname" .) }}
                  key: username
            {{- end }}
            {{- if .Values.registry.oci.password }}
            - name: EDC_REGISTRY_OCI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.registry.existingSecret | default (include "tap74-registry.fullname" .) }}
                  key: password
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
