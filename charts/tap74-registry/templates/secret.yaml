{{- if and .Values.registry.oci.username .Values.registry.oci.password (not .Values.registry.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tap74-registry.fullname" . }}
  labels:
    {{- include "tap74-registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.registry.oci.username | quote }}
  password: {{ .Values.registry.oci.password | quote }}
{{- end }}
