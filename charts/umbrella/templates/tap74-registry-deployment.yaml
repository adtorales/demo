{{- if .Values.tap74Registry.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tap74-registry
  namespace: {{ .Release.Namespace }}
  labels:
    app: tap74-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tap74-registry
  template:
    metadata:
      labels:
        app: tap74-registry
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/os
                    operator: In
                    values:
                      - linux
      containers:
        - name: tap74-registry
          image: {{ .Values.tap74Registry.image.repository }}:{{ .Values.tap74Registry.image.tag }}
          imagePullPolicy: {{ .Values.tap74Registry.image.pullPolicy }}
          env:
            - name: WEB_HTTP_PORT
              value: {{ .Values.tap74Registry.service.port | quote }}
            - name: WEB_HTTP_PATH
              value: "/"
            - name: EDC_PARTICIPANT_ID
              value: "tap74-registry"
            - name: EDC_REGISTRY_URL
              value: "http://tap74-registry:{{ .Values.tap74Registry.service.port }}/registry"
            {{- if .Values.tap74Registry.oci.images }}
            - name: EDC_REGISTRY_OCI_IMAGES
              value: {{ .Values.tap74Registry.oci.images | quote }}
            {{- end }}
            {{- if .Values.tap74Registry.oci.pollSeconds }}
            - name: EDC_REGISTRY_OCI_POLL_SECONDS
              value: {{ .Values.tap74Registry.oci.pollSeconds | quote }}
            {{- end }}
            {{- if .Values.tap74Registry.credentials.existingSecret }}
            - name: EDC_REGISTRY_OCI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tap74Registry.credentials.existingSecret }}
                  key: {{ .Values.tap74Registry.credentials.usernameKey | default "username" }}
            - name: EDC_REGISTRY_OCI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tap74Registry.credentials.existingSecret }}
                  key: {{ .Values.tap74Registry.credentials.passwordKey | default "password" }}
            {{- end }}
            - name: EDC_REGISTRY_OCI_INSECURE
              value: {{ .Values.tap74Registry.oci.insecure | quote }}
          ports:
            - containerPort: {{ .Values.tap74Registry.service.port }}
          readinessProbe:
            httpGet:
              path: /registry
              port: {{ .Values.tap74Registry.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /registry
              port: {{ .Values.tap74Registry.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.tap74Registry.resources | nindent 12 }}
{{- end }}
